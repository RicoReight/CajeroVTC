<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Calculadora de Cambio VTC / Taxi</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Pantalla de carga -->
<div id="splash">
  <div class="splash-logo">💰<br>Cambio VTC</div>
  <div class="splash-sub">Cargando...</div>
  <div class="splash-spinner"></div>
</div>

<div class="app">
  <header>
    <h1 class="title">Calculadora de Cambio</h1>
    <button class="btn-menu" onclick="toggleMenu()">INVENTARIO</button>
  </header>

  <div class="cash-summary-card">
    <div class="summary-top">
      <div class="summary-title">💵 CAMBIO EN CAJA</div>
      <div class="summary-amount" id="totalCashDisplay">0,00 €</div>
    </div>

    <div class="limits-row">
      <div class="limit-card"><div class="limit-card-title">≤ 20 €</div><div id="status20" class="status-badge">--</div></div>
      <div class="limit-card"><div class="limit-card-title">≤ 30 €</div><div id="status30" class="status-badge">--</div></div>
      <div class="limit-card"><div class="limit-card-title">≤ 50 €</div><div id="status50" class="status-badge">--</div></div>
      <div class="limit-card"><div class="limit-card-title">≤ 80 €</div><div id="status80" class="status-badge">--</div></div>
      <div class="limit-card"><div class="limit-card-title">≤ 100 €</div><div id="status100" class="status-badge">--</div></div>
    </div>
  </div>

  <div class="card">
    <label for="price">Precio del viaje (€)</label>
    <input id="price" type="number" inputmode="decimal" step="0.01" placeholder="Ej. 14.50" oninput="calculate()">

    <label>Dinero recibido</label>
    <div class="grid" id="moneyButtons"></div>

    <div class="received-box">
      <div class="received-display">
        <div style="font-size:11px;color:#94a3b8;font-weight:700">TOTAL RECIBIDO</div>
        <div class="received-text" id="paidDisplay">0,00 €</div>
      </div>
      <button type="button" class="btn-undo-lg" onclick="undoMoney()">↩ DESHACER</button>
    </div>

    <div style="margin-top:6px">
      <label for="tip">Propina (€)</label>
      <div class="tip-row">
        <input id="tip" type="number" inputmode="decimal" step="0.01" placeholder="0.00" oninput="calculate()">
        <button type="button" class="btn-tip-all" onclick="setAllTip()">Quedarme con el cambio</button>
      </div>
    </div>

    <div id="changeResult">
      <div class="change-header" id="changeTotal"></div>
      <div class="change-grid" id="changeGrid"></div>
    </div>

    <button type="button" class="primary" onclick="confirmTransaction()">💾 GUARDAR Y CONFIRMAR</button>
  </div>
</div>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <h2 style="margin:0;font-size:18px">Inventario & Propinas</h2>
    <button style="background:none;border:none;color:#fff;font-size:24px;cursor:pointer" onclick="toggleMenu()">✕</button>
  </div>
  <div class="tip-total-box" id="totalTipDisplay">Propinas: 0,00 €</div>
  <button type="button" class="btn-reset-stock" onclick="resetStock()">⚠️ RESETEAR A CERO</button>
  <div id="stockList"></div>
</div>

<script src="app.js"></script>
<script>
  // Bloquear zoom por pellizco
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
  document.addEventListener('gesturechange', function(e){ e.preventDefault(); });
  document.addEventListener('gestureend', function(e){ e.preventDefault(); });

  // Bloquear zoom por doble toque
  let lastTouchEnd = 0;
  document.addEventListener('touchend', function(e){
    const now = Date.now();
    if(now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, false);

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>
</body>
</html>
