<div class="drawer" id="drawer">
  <div class="drawer-header">
    <h2 style="margin:0;font-size:18px">☰ Menú</h2>
    <button style="background:none;border:none;color:#fff;font-size:24px;cursor:pointer" onclick="toggleMenu()">✕</button>
  </div>

  <!-- ============ PESTAÑAS ============ -->
  <div style="display:flex;gap:6px;margin-bottom:14px;position:sticky;top:0;background:#0f172a;padding-bottom:8px;z-index:10">
    <button type="button" id="tabCaja" onclick="drawerTab('caja')"
      style="flex:1;padding:12px 6px;border-radius:10px;border:2px solid #3b82f6;
             background:linear-gradient(135deg,#1e3a8a,#1e40af);color:#fff;
             font-weight:900;font-size:13px;cursor:pointer;transition:all 0.2s">
      📦 Caja
    </button>
    <button type="button" id="tabHerramientas" onclick="drawerTab('herramientas')"
      style="flex:1;padding:12px 6px;border-radius:10px;border:2px solid #334155;
             background:#1e293b;color:#94a3b8;
             font-weight:900;font-size:13px;cursor:pointer;transition:all 0.2s">
      🛠️ Herramientas
    </button>
    <button type="button" id="tabSistema" onclick="drawerTab('sistema')"
      style="flex:1;padding:12px 6px;border-radius:10px;border:2px solid #334155;
             background:#1e293b;color:#94a3b8;
             font-weight:900;font-size:13px;cursor:pointer;transition:all 0.2s">
      ⚙️ Sistema
    </button>
  </div>

  <!-- ============ CONTENIDO: CAJA ============ -->
  <div id="drawerTabCaja">
    <div class="tip-total-box" id="totalTipDisplay" style="margin-bottom:10px">💶 Propinas: 0,00 €</div>

    <div id="stockList" style="min-height:60px"></div>
    <div id="recomendacionesBox"></div>

    <div id="toggleEdicionBox" style="display:flex;align-items:center;justify-content:space-between;padding:12px;background:#0f172a;border:1px solid #334155;border-radius:10px;margin-top:14px">
      <div>
        <div style="font-size:14px;color:#fff;font-weight:800">🔧 Modo edición</div>
        <div style="font-size:11px;color:#64748b;margin-top:2px;line-height:1.3">Corrige stock con + / −</div>
      </div>
      <button type="button" id="toggleEdicionBtn" onclick="toggleModoEdicion()" style="background:#334155;color:#94a3b8;border:none;border-radius:20px;padding:6px 14px;font-weight:800;font-size:12px;cursor:pointer;min-width:60px">OFF</button>
    </div>
    <div id="panelInventario"></div>
  </div>

  <!-- ============ CONTENIDO: HERRAMIENTAS ============ -->
  <div id="drawerTabHerramientas" style="display:none">
    <button type="button" onclick="toggleMenu();abrirDiasPantalla()"
      style="width:100%;display:flex;align-items:center;gap:12px;padding:14px;background:linear-gradient(135deg,#1e293b,#0f172a);border:2px solid #334155;border-radius:12px;color:#fff;cursor:pointer;font-size:15px;font-weight:800;text-align:left;margin-bottom:8px">
      <span style="font-size:22px">💼</span><span style="flex:1">Días de trabajo</span><span style="color:#38bdf8;font-size:18px">›</span>
    </button>
    <button type="button" onclick="toggleMenu();abrirCierrePantalla()"
      style="width:100%;display:flex;align-items:center;gap:12px;padding:14px;background:linear-gradient(135deg,#1e293b,#0f172a);border:2px solid #334155;border-radius:12px;color:#fff;cursor:pointer;font-size:15px;font-weight:800;text-align:left;margin-bottom:8px">
      <span style="font-size:22px">💰</span><span style="flex:1">Depósito de caja</span><span style="color:#38bdf8;font-size:18px">›</span>
    </button>
    <button type="button" onclick="toggleMenu();abrirMovimientoPantalla()"
      style="width:100%;display:flex;align-items:center;gap:12px;padding:12px;background:#0f172a;border:1px solid #334155;border-radius:10px;color:#c4b5fd;cursor:pointer;font-size:14px;font-weight:700;text-align:left;margin-bottom:6px">
      <span style="font-size:18px">📝</span><span style="flex:1">Movimiento manual</span><span style="color:#64748b;font-size:16px">›</span>
    </button>
    <button type="button" onclick="toggleMenu();abrirCambioPantalla()"
      style="width:100%;display:flex;align-items:center;gap:12px;padding:12px;background:#0f172a;border:1px solid #334155;border-radius:10px;color:#93c5fd;cursor:pointer;font-size:14px;font-weight:700;text-align:left;margin-bottom:6px">
      <span style="font-size:18px">🔀</span><span style="flex:1">Cambiar billete o monedas</span><span style="color:#64748b;font-size:16px">›</span>
    </button>
    <button type="button" onclick="toggleMenu();abrirReponerPantalla()"
      style="width:100%;display:flex;align-items:center;gap:12px;padding:12px;background:#0f172a;border:1px solid #334155;border-radius:10px;color:#86efac;cursor:pointer;font-size:14px;font-weight:700;text-align:left;margin-bottom:6px">
      <span style="font-size:18px">🏦</span><span style="flex:1">Reponer caja</span><span style="color:#64748b;font-size:16px">›</span>
    </button>
    <button type="button" onclick="toggleMenu();abrirLimitePantalla()"
      style="width:100%;display:flex;align-items:center;gap:12px;padding:12px;background:#0f172a;border:1px solid #334155;border-radius:10px;color:#fcd34d;cursor:pointer;font-size:14px;font-weight:700;text-align:left;margin-bottom:6px">
      <span style="font-size:18px">🔒</span><span style="flex:1">Límite y máximos</span><span style="color:#64748b;font-size:16px">›</span>
    </button>
    <button type="button" onclick="toggleMenu();abrirDiagnostico()"
      style="width:100%;display:flex;align-items:center;gap:12px;padding:12px;background:#0f172a;border:1px solid #334155;border-radius:10px;color:#38bdf8;cursor:pointer;font-size:14px;font-weight:700;text-align:left;margin-bottom:6px">
      <span style="font-size:18px">📊</span><span style="flex:1">Diagnóstico</span><span style="color:#64748b;font-size:16px">›</span>
    </button>
  </div>

  <!-- ============ CONTENIDO: SISTEMA ============ -->
  <div id="drawerTabSistema" style="display:none">
    <button type="button" onclick="toggleMenu();abrirResetPantalla()"
      style="width:100%;display:flex;align-items:center;gap:12px;padding:14px;background:linear-gradient(135deg,#1e293b,#0f172a);border:2px solid #334155;border-radius:12px;color:#fca5a5;cursor:pointer;font-size:15px;font-weight:800;text-align:left;margin-bottom:8px">
      <span style="font-size:22px">🔄</span><span style="flex:1">Reset y borrados</span><span style="color:#64748b;font-size:18px">›</span>
    </button>

    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px;background:#0f172a;border:1px solid #334155;border-radius:10px;margin-bottom:6px">
      <div style="display:flex;align-items:center;gap:12px;flex:1;min-width:0">
        <span style="font-size:18px">🐞</span>
        <div style="flex:1;min-width:0">
          <div style="font-size:14px;color:#fff;font-weight:700">Modo debug</div>
          <div style="font-size:11px;color:#64748b;margin-top:2px;line-height:1.3">Consola en pantalla</div>
        </div>
      </div>
      <button type="button" id="btnDebugToggle" onclick="toggleModoDebug()" style="background:#334155;color:#94a3b8;border:none;border-radius:20px;padding:6px 14px;font-weight:800;font-size:12px;cursor:pointer;min-width:60px">OFF</button>
    </div>
  </div>
</div>
